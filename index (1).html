<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WASSCE Sprint — Offline Exam Prep</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0B1622" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />

<style>
  :root {
    --bg: #0B1622;
    --panel: #132233;
    --paper: #F7F5EE;
    --paper-alt: #EFECE2;
    --ink: #0F172A;
    --muted: #4B5563;
    --gold: #E5A93C;
    --green: #15803D;
    --red: #DC2626;
    --border: #D8D3C5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--paper);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .wrap { width: 100%; max-width: 780px; margin: 0 auto; padding: 20px 16px 36px; flex: 1; }
  h1, h2, h3 { margin: 0; line-height: 1.25; }
  .brand { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; color: var(--paper); }
  .sub { margin-top: 6px; color: #B6C2CF; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 20px; }
  .card {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
    text-align: left;
    color: var(--paper);
  }
  .card.active { border-color: var(--gold); background: #16293D; }
  .controls {
    margin-top: 16px;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
  }
  .seg { display: inline-flex; background: var(--bg); padding: 4px; border-radius: 8px; gap: 4px; }
  .seg button {
    border: 0; background: transparent; color: #B6C2CF; font-weight: 600; font-size: 13px;
    padding: 8px 12px; border-radius: 6px; cursor: pointer;
  }
  .seg button.active { background: var(--gold); color: var(--bg); }
  .btn-primary {
    border: 0; background: var(--gold); color: var(--bg); font-weight: 800; font-size: 15px;
    padding: 12px 22px; border-radius: 8px; cursor: pointer; min-height: 44px;
  }
  .btn-secondary {
    border: 1px solid rgba(255,255,255,0.2); background: var(--panel); color: var(--paper);
    font-weight: 600; font-size: 14px; padding: 10px 16px; border-radius: 8px; cursor: pointer; min-height: 44px;
  }
  .hud { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--panel); border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
  .bar > div { height: 100%; background: var(--gold); transition: width 0.25s ease; }
  .paper {
    background: var(--paper); color: var(--ink); border: 1px solid var(--border);
    border-radius: 12px; padding: 22px;
  }
  .meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .prompt { margin-top: 12px; font-size: 20px; font-weight: 700; }
  .opts { display: grid; gap: 10px; margin-top: 18px; }
  .opt {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    min-height: 50px; padding: 10px 14px; border-radius: 8px; border: 2px solid var(--border);
    background: #fff; color: var(--ink); font-size: 15px; font-weight: 500; cursor: pointer;
  }
  .opt .key {
    width: 28px; height: 28px; border-radius: 6px; background: var(--paper-alt); border: 1px solid var(--border);
    display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0;
  }
  .opt.correct { background: #ECFDF5; border-color: var(--green); color: #064E3B; }
  .opt.correct .key { background: var(--green); border-color: var(--green); color: #fff; }
  .opt.wrong { background: #FEF2F2; border-color: var(--red); color: #7F1D1D; }
  .opt.wrong .key { background: var(--red); border-color: var(--red); color: #fff; }
  .hint-box { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: #FEF3C7; color: #78350F; font-size: 13px; }
  .solution { margin-top: 18px; padding: 16px; border-radius: 8px; background: var(--paper-alt); border: 1px solid var(--border); font-size: 14px; }
  .solution ol { margin: 8px 0; padding-left: 20px; }
  .solution li { margin-bottom: 6px; }
  .summary-box { background: var(--panel); border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; padding: 22px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.12); font-variant-numeric: tabular-nums; }
  .hide { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div id="titleView">
    <h1 class="brand">WASSCE Sprint (Offline HTML)</h1>
    <p class="sub">Zero-data timed WASSCE practice with step-by-step worked solutions.</p>
    <div class="grid" id="subjectGrid"></div>
    <div class="controls">
      <div>
        <div style="font-size:12px;color:#A3B3C4;margin-bottom:6px">Quiz Length</div>
        <div class="seg" id="lenSeg"></div>
      </div>
      <div>
        <div style="font-size:12px;color:#A3B3C4;margin-bottom:6px">Timer</div>
        <div class="seg" id="timerSeg"></div>
      </div>
      <button class="btn-primary" id="startBtn" type="button">Start Quiz</button>
    </div>
    <p class="sub" style="margin-top:14px;font-size:12px">Keys: 1–4 Answer · H Hint · Enter Next</p>
  </div>

  <div id="playView" class="hide">
    <div class="hud">
      <div>
        <strong id="hudSubj"></strong>
        <div id="hudProg" style="font-size:12px;color:#9FB0C2"></div>
      </div>
      <div style="display:flex;gap:14px;align-items:center">
        <span id="hudTimer" style="font-weight:700"></span>
        <span id="hudScore" style="color:var(--gold);font-weight:700">Score: 0</span>
        <button class="btn-secondary" id="quitBtn" type="button" style="padding:6px 12px;min-height:36px">Exit</button>
      </div>
    </div>
    <div class="bar"><div id="timeBar" style="width:100%"></div></div>
    <div class="paper">
      <div class="meta">
        <span id="qMeta"></span>
        <button type="button" id="hintBtn" style="border:1px solid var(--border);background:#fff;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer">Show Hint (H)</button>
      </div>
      <div class="prompt" id="qPrompt"></div>
      <div class="hint-box hide" id="hintBox"></div>
      <div class="opts" id="optsWrap"></div>
      <div class="solution hide" id="solWrap"></div>
      <div class="hide" id="nextRow" style="margin-top:14px;text-align:right">
        <button class="btn-primary" id="nextBtn" type="button">Next Question</button>
      </div>
    </div>
  </div>

  <div id="summaryView" class="hide">
    <div class="summary-box">
      <div style="font-size:12px;color:#A3B3C4" id="sumSubj"></div>
      <h2 id="sumGrade" style="margin-top:6px;font-size:28px;color:var(--gold)"></h2>
      <div class="stats" id="sumStats"></div>
      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn-primary" id="againBtn" type="button">Play Again</button>
        <button class="btn-secondary" id="homeBtn" type="button">Change Subject</button>
      </div>
    </div>
    <div class="paper" style="margin-top:16px" id="reviewList"></div>
  </div>
</div>

<script>
const QUESTIONS = [{"id":"m-01","subject":"maths","topic":"Indices & Equations","tier":"free","difficulty":"Core","prompt":"Solve for x if 2^(3x - 1) = 32.","options":["x = 1","x = 2","x = 3","x = 4"],"correctIndex":1,"hint":"Express 32 as a power of 2, then equate the exponents.","steps":["Write 32 as a base-2 power: 32 = 2^5.","Rewrite the equation: 2^(3x - 1) = 2^5.","Since the bases are equal, equate exponents: 3x - 1 = 5.","Add 1 to both sides: 3x = 6, so x = 2."],"examinerNote":"Always double-check by substituting x = 2 back: 2^(6 - 1) = 2^5 = 32."},{"id":"m-02","subject":"maths","topic":"Surds","tier":"free","difficulty":"Core","prompt":"Simplify √48 + √27 - √12.","options":["3√3","5√3","7√3","9√3"],"correctIndex":1,"hint":"Factor out the largest perfect square inside each radical (look for multiples of 3).","steps":["Factor each surd into a perfect square × 3:","√48 = √(16 × 3) = 4√3.","√27 = √(9 × 3) = 3√3, and √12 = √(4 × 3) = 2√3.","Combine like surds: 4√3 + 3√3 - 2√3 = (4 + 3 - 2)√3 = 5√3."],"examinerNote":"Never add numbers inside different square roots directly; simplify each radical first."},{"id":"m-03","subject":"maths","topic":"Percentages & Profit","tier":"free","difficulty":"Core","prompt":"A trader buys a bag of maize for GH₵240 and sells it at a 15% profit. What is the selling price?","options":["GH₵255","GH₵264","GH₵276","GH₵280"],"correctIndex":2,"hint":"15% of 240 equals 10% of 240 plus half of that amount.","steps":["Find 15% profit on the cost price: 0.15 × 240 = GH₵36.","Add the profit to the cost price: 240 + 36 = GH₵276.","Shortcut check: 1.15 × 240 = 240 + 24 + 12 = 276."],"examinerNote":"Profit percentage is always calculated on the cost price unless stated otherwise."},{"id":"m-04","subject":"maths","topic":"Linear Equations & Fractions","tier":"free","difficulty":"Core","prompt":"Find the value of y if (y + 2)/3 - (y - 1)/4 = 2.","options":["y = 11","y = 13","y = 15","y = 17"],"correctIndex":1,"hint":"Multiply every term by 12, the LCM of 3 and 4, and watch the minus sign carefully.","steps":["Multiply through by the LCM (12): 4(y + 2) - 3(y - 1) = 24.","Expand brackets carefully: 4y + 8 - 3y + 3 = 24.","Simplify: y + 11 = 24.","Subtract 11: y = 13."],"examinerNote":"The classic WASSCE trap is -3(y - 1): remember negative × negative gives +3, not -3."},{"id":"m-05","subject":"maths","topic":"Circle Theorems","tier":"free","difficulty":"Core","prompt":"Points P, Q, R lie on a circle with centre O. If angle POQ = 116°, find angle PRQ where R is on the major arc.","options":["32°","58°","64°","122°"],"correctIndex":1,"hint":"Recall the relationship between the angle at the centre and the angle at the circumference.","steps":["Both angles subtend the same minor arc PQ.","By the circle theorem, the angle at the centre is twice the angle at the circumference.","Therefore, angle PRQ = 116° ÷ 2 = 58°."],"examinerNote":"Always check whether R lies on the major arc (half of 116°) or the minor arc (180° - 58°)."},{"id":"e-01","subject":"english","topic":"Subject-Verb Concord","tier":"free","difficulty":"Core","prompt":"Choose the correct option: Neither the headmaster nor the teachers ______ present at the morning assembly.","options":["was","were","is","has been"],"correctIndex":1,"hint":"With \"neither ... nor\", the verb agrees with the noun closer to the verb.","steps":["Identify the correlative conjunction: \"Neither ... nor\".","Apply the rule of proximity: the verb agrees with the nearer subject (\"the teachers\").","\"The teachers\" is plural, so the past plural verb \"were\" is required."],"examinerNote":"If the sentence were reversed (\"Neither the teachers nor the headmaster...\"), \"was\" would be correct."},{"id":"e-02","subject":"english","topic":"Lexis & Structure","tier":"free","difficulty":"Core","prompt":"Choose the word opposite in meaning to the underlined: The witness gave a CANDID account of the accident.","options":["frank","evasive","brief","nervous"],"correctIndex":1,"hint":"\"Candid\" means open, honest, and straightforward.","steps":["\"Candid\" means truthful, open, and direct.","\"Frank\" is a synonym, not an antonym.","\"Evasive\" means avoiding giving a direct or honest answer — the exact opposite."],"examinerNote":"In WASSCE Antonyms, watch out for synonyms placed as the first option to catch rushed readers."},{"id":"e-03","subject":"english","topic":"Idiomatic Expressions","tier":"free","difficulty":"Core","prompt":"Select the best interpretation: After three failed attempts, Kojo decided to CALL IT A DAY.","options":["work until midnight","stop working for the time being","celebrate his victory","ask his friend for help"],"correctIndex":1,"hint":"Think of what workers say when they decide they have done enough and want to stop.","steps":["The idiom \"call it a day\" means to decide to stop doing an activity or work for the rest of the day (or stop trying).","None of the literal time references (\"midnight\") or celebration options match its meaning."],"examinerNote":"Do not interpret idioms word-for-word; read the full sentence context first."},{"id":"e-04","subject":"english","topic":"Prepositions & Collocation","tier":"free","difficulty":"Core","prompt":"Fill in the blank: The prefect was accused ______ leaking the examination timetable.","options":["for","with","of","about"],"correctIndex":2,"hint":"Which preposition always collocates with the verb \"accuse\"?","steps":["In standard English, the verb \"accuse\" strictly collocates with \"of\" (accuse someone of something).","\"Charge\" takes \"with\", and \"blame\" takes \"for\" — do not mix them up."],"examinerNote":"Remember the trio: accused OF, charged WITH, blamed FOR."},{"id":"e-05","subject":"english","topic":"Oral English (Word Stress)","tier":"free","difficulty":"Core","prompt":"Choose the option that shows the correct primary stress on the word PHOTOGRAPHY (stressed syllable in capitals):","options":["PHO-to-graph-y","pho-TO-graph-y","pho-to-GRAPH-y","pho-to-graph-Y"],"correctIndex":1,"hint":"Words ending in \"-graphy\" usually place primary stress on the syllable just before \"-graphy\" (the antepenultimate syllable).","steps":["Count the syllables from the end: pho-TOG-ra-phy.","Words ending in \"-phy\" / \"-graphy\" carry primary stress on the third syllable from the end.","Unlike \"PHO-to-graph\" (1st syllable), \"pho-TO-graph-y\" shifts stress to the 2nd syllable."],"examinerNote":"Compare PHO-to-graph, pho-TO-graph-y, and pho-to-GRAPH-ic — a classic WASSCE stress pattern."},{"id":"s-01","subject":"science","topic":"Photosynthesis & Plant Nutrition","tier":"free","difficulty":"Core","prompt":"Which gas is released as a by-product during the light-dependent stage of photosynthesis?","options":["Carbon dioxide","Nitrogen","Oxygen","Methane"],"correctIndex":2,"hint":"Water molecules (H₂O) are split by light energy (photolysis) inside chloroplasts.","steps":["Photosynthesis equation: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂.","Light energy splits water molecules (photolysis) into hydrogen and oxygen.","The oxygen gas (O₂) diffuses out of the leaf through the stomata."],"examinerNote":"Remember that the oxygen released comes from water (H₂O), not from carbon dioxide."},{"id":"s-02","subject":"science","topic":"Acids, Bases & Indicators","tier":"free","difficulty":"Core","prompt":"What colour does blue litmus paper turn when dipped into dilute hydrochloric acid, and what is the typical pH range?","options":["Remains blue; pH above 7","Turns red; pH below 7","Turns colourless; pH equal to 7","Turns yellow; pH above 10"],"correctIndex":1,"hint":"Think \"Acid → Red\" and recall the pH scale (0–14).","steps":["Acids turn blue litmus paper red.","On the pH scale, 7 is neutral, below 7 is acidic, and above 7 is alkaline.","Dilute HCl is a strong acid, so it turns blue litmus red and has pH < 7."],"examinerNote":"Red litmus stays red in acid; only blue litmus shows a visible change in acids."},{"id":"s-03","subject":"science","topic":"Electricity (Ohm's Law)","tier":"free","difficulty":"Core","prompt":"A potential difference of 12 V is applied across a 4 Ω resistor. Calculate the current flowing through the resistor.","options":["0.33 A","3 A","8 A","48 A"],"correctIndex":1,"hint":"Use Ohm's law: V = I × R.","steps":["State Ohm's Law: V = I × R.","Rearrange for current I: I = V / R.","Substitute V = 12 V and R = 4 Ω: I = 12 / 4 = 3 A."],"examinerNote":"Always write the SI unit (A for amperes) after numerical answers in Paper 2."},{"id":"s-04","subject":"science","topic":"Atomic Structure & Bonding","tier":"free","difficulty":"Core","prompt":"Element X has atomic number 11 and Element Y has atomic number 17. What type of bond forms between X and Y?","options":["Covalent bond","Metallic bond","Ionic (electrovalent) bond","Hydrogen bond"],"correctIndex":2,"hint":"Write their electron configurations (2,8,1 and 2,8,7) to see which transfers an electron.","steps":["Element X (Z = 11) has configuration 2, 8, 1 — a Group 1 metal (Sodium) that loses 1 electron to form X⁺.","Element Y (Z = 17) has configuration 2, 8, 7 — a Group 7 non-metal (Chlorine) that gains 1 electron to form Y⁻.","Electrostatic attraction between oppositely charged ions X⁺ and Y⁻ forms an ionic bond."],"examinerNote":"Metal + Non-metal → electron transfer → ionic bond."},{"id":"s-05","subject":"science","topic":"Work, Energy & Power","tier":"free","difficulty":"Core","prompt":"A student lifts a 5 kg bucket of water vertically through a height of 4 m (g = 10 m/s²). How much gravitational potential energy is gained?","options":["20 J","50 J","100 J","200 J"],"correctIndex":3,"hint":"Potential energy PE = m × g × h.","steps":["Identify values: mass m = 5 kg, g = 10 m/s², height h = 4 m.","Apply formula: PE = mgh = 5 × 10 × 4.","Multiply: 50 × 4 = 200 J."],"examinerNote":"20 J is a common mistake from multiplying m × h without multiplying by g = 10 m/s²."},{"id":"m-06","subject":"maths","topic":"Number Bases","tier":"free","difficulty":"Core","prompt":"Convert 1011 (base 2) to a number in base 10.","options":["9","10","11","13"],"correctIndex":2,"hint":"Write the place values from the right: 1, 2, 4, 8.","steps":["Place values from the right are 2⁰, 2¹, 2², 2³ = 1, 2, 4, 8.","Multiply each digit by its place value: (1×8) + (0×4) + (1×2) + (1×1).","Add: 8 + 0 + 2 + 1 = 11."],"examinerNote":"Always write the base as a subscript in your working, for example 1011₂ = 11₁₀."},{"id":"m-07","subject":"maths","topic":"Simultaneous Equations","tier":"free","difficulty":"Core","prompt":"Solve the simultaneous equations: 2x + y = 7 and x − y = 2.","options":["x = 2, y = 3","x = 3, y = 1","x = 4, y = −1","x = 1, y = 5"],"correctIndex":1,"hint":"Add the two equations to eliminate y.","steps":["Add the equations: (2x + y) + (x − y) = 7 + 2, so 3x = 9.","Divide by 3: x = 3.","Substitute into x − y = 2: 3 − y = 2, so y = 1."],"examinerNote":"Check your answer in the other equation: 2(3) + 1 = 7, which is correct."},{"id":"m-08","subject":"maths","topic":"Mensuration (Circle)","tier":"free","difficulty":"Core","prompt":"Using π = 22/7, find the area of a circle of diameter 14 cm.","options":["154 cm²","44 cm²","77 cm²","616 cm²"],"correctIndex":0,"hint":"Find the radius first. The radius is half of the diameter.","steps":["Radius r = 14 ÷ 2 = 7 cm.","Area = πr² = (22/7) × 7 × 7.","Cancel the 7: 22 × 7 = 154 cm²."],"examinerNote":"616 cm² comes from using the diameter as the radius, and 44 cm² is the circumference. Read what the question gives you."},{"id":"m-09","subject":"maths","topic":"Probability","tier":"free","difficulty":"Core","prompt":"A bag contains 4 red balls and 6 blue balls. One ball is picked at random. What is the probability that it is red?","options":["3/5","1/4","1/5","2/5"],"correctIndex":3,"hint":"Probability = number of favourable outcomes ÷ total number of outcomes.","steps":["Total balls = 4 + 6 = 10.","Favourable outcomes (red) = 4.","P(red) = 4/10 = 2/5."],"examinerNote":"Always simplify your fraction, and remember a probability can never be more than 1."},{"id":"m-10","subject":"maths","topic":"Statistics (Mean)","tier":"free","difficulty":"Core","prompt":"The mean of the numbers 4, 7, x, 9 and 10 is 8. Find x.","options":["8","9","10","12"],"correctIndex":2,"hint":"Mean = sum of values ÷ number of values.","steps":["There are 5 numbers, so the total is 8 × 5 = 40.","Add the known numbers: 4 + 7 + 9 + 10 = 30.","So x = 40 − 30 = 10."],"examinerNote":"Check: (4 + 7 + 10 + 9 + 10) ÷ 5 = 40 ÷ 5 = 8."},{"id":"m-11","subject":"maths","topic":"Coordinate Geometry","tier":"free","difficulty":"Core","prompt":"Find the gradient of the line joining the points (2, 3) and (6, 11).","options":["2","1/2","4","3"],"correctIndex":0,"hint":"Gradient = change in y ÷ change in x.","steps":["Change in y = 11 − 3 = 8.","Change in x = 6 − 2 = 4.","Gradient = 8 ÷ 4 = 2."],"examinerNote":"Subtract the coordinates in the same order for both y and x, or you will get the wrong sign."},{"id":"m-12","subject":"maths","topic":"Variation","tier":"free","difficulty":"Core","prompt":"y varies directly as x, and y = 12 when x = 3. Find y when x = 5.","options":["15","20","24","36"],"correctIndex":1,"hint":"Direct variation means y = kx, where k is a constant.","steps":["Write y = kx. Substitute y = 12 and x = 3: 12 = 3k, so k = 4.","The relationship is y = 4x.","When x = 5, y = 4 × 5 = 20."],"examinerNote":"Always find the constant k first, then write the full equation before substituting again."},{"id":"m-13","subject":"maths","topic":"Pythagoras' Theorem","tier":"free","difficulty":"Core","prompt":"A 13 m ladder leans against a vertical wall. Its foot is 5 m from the base of the wall. How high up the wall does the ladder reach?","options":["8 m","10 m","12 m","18 m"],"correctIndex":2,"hint":"The ladder is the hypotenuse, the longest side of the right-angled triangle.","steps":["Hypotenuse = 13 m and one side = 5 m.","Apply a² + b² = c²: 5² + h² = 13², so 25 + h² = 169.","h² = 144, so h = 12 m."],"examinerNote":"A frequent mistake is adding 5² + 13². The hypotenuse is always the one that stands alone."},{"id":"m-14","subject":"maths","topic":"Linear Inequalities","tier":"free","difficulty":"Core","prompt":"Solve the inequality 3x − 4 < 11.","options":["x < 3","x > 5","x < 5","x < 7"],"correctIndex":2,"hint":"Treat it like an equation, and only flip the sign if you multiply or divide by a negative number.","steps":["Add 4 to both sides: 3x < 15.","Divide both sides by 3: x < 5.","Dividing by a positive number does not change the direction of the sign."],"examinerNote":"Remember to flip the inequality sign only when you multiply or divide by a negative number."},{"id":"m-15","subject":"maths","topic":"Simple Interest","tier":"free","difficulty":"Core","prompt":"Find the simple interest on GH₵800 invested at 5% per annum for 3 years.","options":["GH₵40","GH₵120","GH₵140","GH₵920"],"correctIndex":1,"hint":"Use I = (P × R × T) ÷ 100.","steps":["P = 800, R = 5, T = 3.","I = (800 × 5 × 3) ÷ 100 = 12000 ÷ 100.","I = GH₵120."],"examinerNote":"GH₵920 is the total amount (800 + 120). Check whether the question asks for the interest or the amount."}];
const SUBJECTS = [
  { id: 'maths', name: 'Core Mathematics', desc: 'Algebra · Surds · Mensuration' },
  { id: 'english', name: 'English Language', desc: 'Lexis · Concord · Oral Stress' },
  { id: 'science', name: 'Integrated Science', desc: 'Bonding · Acids · Electricity' }
];
const LETTERS = ['A','B','C','D'];
let subj = 'maths', roundLen = 5, timerSec = 45;
let deck = [], idx = 0, score = 0, streak = 0, bestStreak = 0, revealed = false, usedHint = false, timeLeft = 45, timerId = null, records = [];

const $ = (id) => document.getElementById(id);

function waecGrade(acc) {
  if (acc >= 80) return 'A1 (Excellent)';
  if (acc >= 70) return 'B2 (Very Good)';
  if (acc >= 65) return 'B3 (Good)';
  if (acc >= 60) return 'C4 (Credit)';
  if (acc >= 55) return 'C5 (Credit)';
  if (acc >= 50) return 'C6 (Credit)';
  if (acc >= 45) return 'D7 (Pass)';
  if (acc >= 40) return 'E8 (Pass)';
  return 'F9 (Needs Revision)';
}

function renderTitle() {
  $('titleView').classList.remove('hide');
  $('playView').classList.add('hide');
  $('summaryView').classList.add('hide');

  $('subjectGrid').innerHTML = SUBJECTS.map(s => {
    const count = QUESTIONS.filter(q => q.subject === s.id).length;
    return '<button type="button" class="card ' + (s.id === subj ? 'active' : '') + '" data-subj="' + s.id + '">' +
      '<strong>' + s.name + '</strong>' +
      '<div style="font-size:12px;color:#A3B3C4;margin-top:4px">' + s.desc + '</div>' +
      '<div style="font-size:12px;color:var(--gold);margin-top:8px">' + count + ' Questions Ready</div>' +
      '</button>';
  }).join('');
  $('subjectGrid').querySelectorAll('button').forEach(b => b.onclick = () => { subj = b.dataset.subj; renderTitle(); });

  const maxAvail = QUESTIONS.filter(q => q.subject === subj).length;
  $('lenSeg').innerHTML = [5, 10, 20].filter(n => n <= Math.max(5, maxAvail)).map(n =>
    '<button type="button" class="' + (roundLen === n ? 'active' : '') + '" data-len="' + n + '">' + n + ' Qs</button>'
  ).join('');
  $('lenSeg').querySelectorAll('button').forEach(b => b.onclick = () => { roundLen = Number(b.dataset.len); renderTitle(); });

  $('timerSeg').innerHTML = [{v:30,l:'30s'},{v:45,l:'45s'},{v:0,l:'Untimed'}].map(t =>
    '<button type="button" class="' + (timerSec === t.v ? 'active' : '') + '" data-t="' + t.v + '">' + t.l + '</button>'
  ).join('');
  $('timerSeg').querySelectorAll('button').forEach(b => b.onclick = () => { timerSec = Number(b.dataset.t); renderTitle(); });
}

function startQuiz() {
  const pool = QUESTIONS.filter(q => q.subject === subj).slice().sort(() => Math.random() - 0.5);
  deck = pool.slice(0, Math.min(roundLen, pool.length));
  idx = 0; score = 0; streak = 0; bestStreak = 0; records = [];
  $('titleView').classList.add('hide');
  $('summaryView').classList.add('hide');
  $('playView').classList.remove('hide');
  showQuestion();
}

function showQuestion() {
  clearInterval(timerId);
  const q = deck[idx];
  revealed = false; usedHint = false; timeLeft = timerSec;
  $('hudSubj').textContent = SUBJECTS.find(s => s.id === subj).name;
  $('hudProg').textContent = 'Question ' + (idx + 1) + ' of ' + deck.length + ' · ' + q.topic;
  $('hudScore').textContent = 'Score: ' + score;
  $('hudTimer').textContent = timerSec > 0 ? timeLeft + 's' : 'Study';
  $('timeBar').style.width = '100%';
  $('qMeta').textContent = q.topic + ' · ' + q.difficulty;
  $('qPrompt').textContent = q.prompt;
  $('hintBtn').classList.remove('hide');
  $('hintBox').classList.add('hide');
  $('solWrap').classList.add('hide');
  $('nextRow').classList.add('hide');

  $('optsWrap').innerHTML = q.options.map((opt, i) =>
    '<button type="button" class="opt" data-idx="' + i + '"><span class="key">' + LETTERS[i] + '</span><span>' + opt + '</span></button>'
  ).join('');
  $('optsWrap').querySelectorAll('button').forEach(b => b.onclick = () => pick(Number(b.dataset.idx), false));

  if (timerSec > 0) {
    timerId = setInterval(() => {
      timeLeft--;
      $('hudTimer').textContent = timeLeft + 's';
      $('timeBar').style.width = Math.max(0, (timeLeft / timerSec) * 100) + '%';
      if (timeLeft <= 0) { clearInterval(timerId); pick(null, true); }
    }, 1000);
  }
}

function pick(choice, timeout) {
  if (revealed) return;
  revealed = true;
  clearInterval(timerId);
  const q = deck[idx];
  const ok = choice !== null && choice === q.correctIndex;
  if (ok) { streak++; bestStreak = Math.max(bestStreak, streak); score += usedHint ? 75 : 100; }
  else { streak = 0; }
  records.push({ q, choice, ok, timeout });
  $('hudScore').textContent = 'Score: ' + score;
  $('hintBtn').classList.add('hide');

  $('optsWrap').querySelectorAll('button').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correctIndex) b.classList.add('correct');
    else if (i === choice) b.classList.add('wrong');
  });

  $('solWrap').innerHTML =
    '<strong style="color:' + (ok ? 'var(--green)' : 'var(--red)') + '">' +
    (ok ? 'Correct!' : (timeout ? 'Time up — ' : 'Incorrect — ') + 'Answer: ' + LETTERS[q.correctIndex]) +
    '</strong>' +
    '<ol>' + q.steps.map(s => '<li>' + s + '</li>').join('') + '</ol>' +
    '<div style="font-size:12px;color:var(--muted)"><strong>Examiner Tip:</strong> ' + q.examinerNote + '</div>';
  $('solWrap').classList.remove('hide');
  $('nextBtn').textContent = idx + 1 >= deck.length ? 'View Final Score' : 'Next Question';
  $('nextRow').classList.remove('hide');
}

function showSummary() {
  $('playView').classList.add('hide');
  $('summaryView').classList.remove('hide');
  const correct = records.filter(r => r.ok).length;
  const acc = records.length ? Math.round((correct / records.length) * 100) : 0;
  $('sumSubj').textContent = SUBJECTS.find(s => s.id === subj).name + ' · Round Complete';
  $('sumGrade').textContent = 'Grade ' + waecGrade(acc);
  $('sumStats').innerHTML =
    '<div><div style="font-size:12px;color:#9FB0C2">Score</div><strong>' + score + '</strong></div>' +
    '<div><div style="font-size:12px;color:#9FB0C2">Correct</div><strong>' + correct + '/' + records.length + ' (' + acc + '%)</strong></div>' +
    '<div><div style="font-size:12px;color:#9FB0C2">Best Streak</div><strong>' + bestStreak + 'x</strong></div>';

  $('reviewList').innerHTML = '<h3 style="margin-bottom:12px">Step-by-Step Review</h3>' +
    records.map((r, i) =>
      '<div style="padding:12px 0;border-top:1px solid var(--border)">' +
      '<div style="font-size:12px;color:' + (r.ok ? 'var(--green)' : 'var(--red)') + ';font-weight:700">Q' + (i+1) + ' · ' + (r.ok ? 'Correct' : 'Missed') + ' · ' + r.q.topic + '</div>' +
      '<div style="font-weight:600;margin:4px 0">' + r.q.prompt + '</div>' +
      '<div style="font-size:13px">Answer: <strong>' + LETTERS[r.q.correctIndex] + '. ' + r.q.options[r.q.correctIndex] + '</strong></div>' +
      '<ol style="margin:6px 0;padding-left:18px;font-size:13px">' + r.q.steps.map(s => '<li>' + s + '</li>').join('') + '</ol>' +
      '</div>'
    ).join('');
}

$('startBtn').onclick = startQuiz;
$('quitBtn').onclick = () => { clearInterval(timerId); renderTitle(); };
$('hintBtn').onclick = () => {
  if (revealed || usedHint) return;
  usedHint = true;
  $('hintBox').textContent = 'Hint: ' + deck[idx].hint;
  $('hintBox').classList.remove('hide');
};
$('nextBtn').onclick = () => {
  if (idx + 1 >= deck.length) showSummary();
  else { idx++; showQuestion(); }
};
$('againBtn').onclick = startQuiz;
$('homeBtn').onclick = renderTitle;

window.addEventListener('keydown', (e) => {
  if ($('playView').classList.contains('hide')) return;
  if (!revealed) {
    if (e.key >= '1' && e.key <= '4') pick(Number(e.key) - 1, false);
    if (e.key.toLowerCase() === 'h') $('hintBtn').click();
  } else if (e.key === 'Enter') {
    $('nextBtn').click();
  }
});

renderTitle();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
